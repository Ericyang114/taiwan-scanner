name: 台股每日掃描推播

on:
  # cron 排程已移至 cron-job.org（更準時可靠）
  # 09:15 台灣 = UTC 01:15 / 12:00 台灣 = UTC 04:00 / 13:35 台灣 = UTC 05:35
  workflow_dispatch:  # 由 cron-job.org 每天準時觸發

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install requests numpy

      - name: 判斷執行哪個腳本
        id: which
        run: |
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          echo "UTC hour=$HOUR min=$MIN"
          if [ "$HOUR" = "04" ] || [ "$HOUR" = "01" ]; then
            echo "script=scripts/midday.py" >> $GITHUB_OUTPUT
          else
            echo "script=scripts/scanner.py" >> $GITHUB_OUTPUT
          fi

      - name: 執行掃描並推播
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ${{ steps.which.outputs.script }}
