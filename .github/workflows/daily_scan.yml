name: 台股每日掃描推播

on:
  schedule:
    # 台灣時間 13:35（UTC+8 = UTC 05:35）收盤掃描
    - cron: '35 5 * * 1-5'
    # 台灣時間 12:00（UTC+8 = UTC 04:00）盤中預警
    - cron: '0 4 * * 1-5'
  workflow_dispatch:  # 允許手動觸發（測試用）

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install requests numpy

      - name: 判斷執行哪個腳本
        id: which
        run: |
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          echo "UTC hour=$HOUR min=$MIN"
          if [ "$HOUR" = "04" ]; then
            echo "script=scripts/midday.py" >> $GITHUB_OUTPUT
          else
            echo "script=scripts/scanner.py" >> $GITHUB_OUTPUT
          fi

      - name: 執行掃描並推播
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ${{ steps.which.outputs.script }}
