}
td {

}
tr:last-child td { border-bottom: none; }

tr.s3 { background: rgba(210,153,34,.05); }

.badge {

.risk-ok   { color: var(--green);  }

.risk-bad  { color: var(--red);    }

.err-row td { color: var(--muted); font-style: italic; }

/* ═══════════════════════════════════════════════════════
   數學工具
═══════════════════════════════════════════════════════ */
function ema(arr, period) {
  const k   = 2 / (period + 1);
  const res = new Array(arr.length).fill(null);
  let sum = 0, cnt = 0, seedEnd = -1;

  for (let i = 0; i < arr.length; i++) {
    const v = arr[i];
    if (v !== null && !isNaN(v)) {
      sum += v; cnt++;
      if (cnt === period) { seedEnd = i; break; }
    }
  }
  if (seedEnd === -1) return res;

  let prev = sum / period;
  res[seedEnd] = prev;
  for (let i = seedEnd + 1; i < arr.length; i++) {
    const v = arr[i];
    if (v === null || isNaN(v)) { res[i] = prev; continue; }
    prev = v * k + prev * (1 - k);
    res[i] = prev;
  }
  return res;
}

function sma(arr, period) {
  return arr.map((_, i) => {
    if (i < period - 1) return null;
    const sl = arr.slice(i - period + 1, i + 1).filter(v => v !== null && !isNaN(v));
    if (sl.length < Math.floor(period * 0.8)) return null;
    return sl.reduce((a, b) => a + b, 0) / sl.length;
  });
}

function trueRange(highs, lows, closes) {
  return closes.map((_, i) => {
    if (i === 0 || closes[i - 1] === null) return highs[i] - lows[i];
    const pc = closes[i - 1];
    return Math.max(highs[i] - lows[i], Math.abs(highs[i] - pc), Math.abs(lows[i] - pc));
  });
}

function wMax(arr, n, end) {
  const sl = arr.slice(Math.max(0, end - n + 1), end + 1).filter(v => v !== null);
  return sl.length ? Math.max(...sl) : null;
}
function wMin(arr, n, end) {
  const sl = arr.slice(Math.max(0, end - n + 1), end + 1).filter(v => v !== null);
  return sl.length ? Math.min(...sl) : null;
}
function wMean(arr, n, end) {
  const sl = arr.slice(Math.max(0, end - n + 1), end + 1).filter(v => v !== null && !isNaN(v));
  return sl.length ? sl.reduce((a, b) => a + b, 0) / sl.length : null;
}
function get(arr, i) { return arr[Math.max(0, i)] ?? null; }

/* ═══════════════════════════════════════════════════════
   條件計算
═══════════════════════════════════════════════════════ */
function calcConditions({ close, high, low, volume }) {
  const n = close.length;
  if (n < 252) return null;

  // 找最後一根有效 K 棒
  let last = n - 1;
  while (last > 0 && (close[last] === null || isNaN(close[last]))) last--;
  if (last < 251) return null;

  const c = close[last];
  const v = volume[last];
  if (!c || !v) return null;

  const ma50  = ema(close, 50);
  const ma150 = ema(close, 150);
  const ma200 = ema(close, 200);
  const ma30w = sma(close, 150);
  const vol50 = sma(volume, 50);

  if (!get(ma50,last) || !get(ma150,last) || !get(ma200,last) || !get(ma30w,last)) return null;

  const h52 = wMax(high,  252, last);
  const l52 = wMin(low,   252, last);

  // Weinstein Stage 2
  const stage2 = c > get(ma30w, last) && get(ma30w, last) > get(ma30w, last - 4);

  // Minervini Trend Template (7 條件)
  const m1 = c > get(ma150,last) && c > get(ma200,last);
  const m2 = get(ma150,last) > get(ma200,last);
  const m3 = last >= 20 ? get(ma200,last) > get(ma200, last - 20) : false;
  const m4 = get(ma50,last) > get(ma150,last) && get(ma50,last) > get(ma200,last);
  const m5 = c > get(ma50,last);
  const m6 = h52 ? c >= h52 * 0.75 : false;
  const m7 = l52 ? c >= l52 * 1.25 : false;
  const ttArr   = [m1, m2, m3, m4, m5, m6, m7];
  const ttScore = ttArr.filter(Boolean).length;
  const tt      = ttScore === 7;

  // VCP
  const atrArr  = sma(trueRange(high, low, close), 14);
  const atrNow  = wMean(atrArr, 10, last);
  const atrPrev = wMean(atrArr, 10, last - 10);
  const volNow  = wMean(volume, 10, last);
  const volPrev = wMean(volume, 10, last - 10);
  const vcp = !!(
    atrNow && atrPrev && volNow && volPrev && h52 &&
    atrNow  < atrPrev * 0.75 &&
    volNow  < volPrev * 0.80 &&
    c >= h52 * 0.70
  );

  // 突破（不含今日的 20 根高點）
  const pivot  = wMax(high, 20, last - 1);
  const avgVol = get(vol50, last);
  const brk    = !!(pivot && avgVol && c > pivot && v > avgVol * 1.4 && c <= pivot * 1.05);

  const score   = [stage2, tt, vcp, brk].filter(Boolean).length;
  const sl      = wMin(low, 20, last);
  const riskPct = sl ? (c - sl) / c * 100 : null;

  return { price: c, stage2, tt, ttScore, vcp, brk, score, riskPct, stopLoss: sl };
}

/* ═══════════════════════════════════════════════════════
   資料抓取（Yahoo Finance + CORS Proxy）
═══════════════════════════════════════════════════════ */
async function fetchOHLCV(stock) {
  const suffix = stock.ex === 'TWO' ? '.TWO' : '.TW';
  const sym    = stock.code + suffix;
  const yUrl   = `https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1d&range=2y`;

  const proxies = [
    `https://corsproxy.io/?${encodeURIComponent(yUrl)}`,
    `https://api.allorigins.win/get?url=${encodeURIComponent(yUrl)}`,
  ];

  for (const pUrl of proxies) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 13000);
    try {
      const res = await fetch(pUrl, { signal: ctrl.signal });
      clearTimeout(timer);
      if (!res.ok) continue;

      let json = await res.json();
      if (json.contents) json = JSON.parse(json.contents); // allorigins wrapper

      const r = json?.chart?.result?.[0];
      if (!r) continue;

      const q    = r.indicators.quote[0];
      const fix  = arr => (arr || []).map(v => (v == null || isNaN(v)) ? null : v);

      return {
        close:  fix(q.close),
        high:   fix(q.high),
        low:    fix(q.low),
        volume: fix(q.volume),
      };
    } catch (_) {
      clearTimeout(timer);
    }
  }
  throw new Error('API 請求失敗');
}

/* ═══════════════════════════════════════════════════════
   掃描引擎
═══════════════════════════════════════════════════════ */
async function scanOne(stock) {
  try {
    const ohlcv = await fetchOHLCV(stock);
    const cond  = calcConditions(ohlcv);
    return cond ? { ...stock, ...cond } : { ...stock, error: '資料不足' };
  } catch (e) {
    return { ...stock, error: e.message };
  }
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ═══════════════════════════════════════════════════════
   UI
═══════════════════════════════════════════════════════ */
let scanning = false;

async function startScan() {
  if (scanning) return;
  scanning = true;

  const btn = document.getElementById('scanBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 掃描中...';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('statText').textContent = '';
  document.getElementById('results').innerHTML = '';

  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('statText').textContent = `股票清單：${STOCKS.length} 支`;

  const allResults = [];
  const BATCH = 8;

  for (let i = 0; i < STOCKS.length; i += BATCH) {
    const batch   = STOCKS.slice(i, i + BATCH);
    const partial = await Promise.all(batch.map(scanOne));
    allResults.push(...partial);

    const done = allResults.length;
    const pct  = Math.round(done / STOCKS.length * 100);
    document.getElementById('progressFill').style.width  = pct + '%';
    document.getElementById('progressLabel').textContent =
      `掃描中 ${done} / ${STOCKS.length}（${pct}%）`;

    renderTable([...allResults].sort((a, b) => (b.score ?? -1) - (a.score ?? -1)));

    if (i + BATCH < STOCKS.length) await sleep(400);
  }

  document.getElementById('progressWrap').style.display = 'none';

  const valid = allResults.filter(r => !r.error);
  const hits  = valid.filter(r => r.score >= 3);
  document.getElementById('statText').textContent =
    `共掃描 ${valid.length} 支有效 / ${STOCKS.length} 支 · 高分標的 ${hits.length} 支`;

  const now = new Date();
  document.getElementById('updatedAt').textContent =
    `更新：${now.toLocaleDateString('zh-TW')} ${now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })}`;

  btn.disabled = false;
  btn.textContent = '▶ 重新掃描';
  scanning = false;
}

function tvUrl(stock) {
  return `https://www.tradingview.com/chart/?symbol=${stock.ex === 'TWO' ? 'TPEX' : 'TWSE'}:${stock.code}`;
}

function chk(v)  { return v ? '<span class="ok">✓</span>' : '<span class="no">✗</span>'; }
function star(v) { return v ? '<span class="star">★</span>' : '<span class="no">✗</span>'; }

function scoreBadge(s) {
  const labels = { 4:'突破買進', 3:'接近就緒', 2:'觀察中', 1:'弱', 0:'—' };
  return `<span class="badge b${s}">${s}/4 ${labels[s] ?? ''}</span>`;
}

function renderTable(results) {
  const rows = results.map(r => {
    if (r.error) {
      return `<tr class="err-row">
        <td><a class="code-link" href="${tvUrl(r)}" target="_blank">${r.code}</a></td>
        <td>${r.name}</td>
        <td>${r.sector}</td>
        <td colspan="7" style="color:var(--muted)">— ${r.error}</td>
      </tr>`;
    }

    const sc  = r.score;
    const ttD = r.tt
      ? `<span class="ok">7/7</span>`
      : `<span style="color:var(--muted)">${r.ttScore}/7</span>`;

    const rpStr = r.riskPct != null
      ? `<span class="${r.riskPct <= 8 ? 'risk-ok' : r.riskPct <= 15 ? 'risk-warn' : 'risk-bad'}">${r.riskPct.toFixed(1)}%</span>`
      : '—';

    return `<tr class="${sc >= 4 ? 's4' : sc >= 3 ? 's3' : ''}">
      <td><a class="code-link" href="${tvUrl(r)}" target="_blank">${r.code}</a></td>
      <td>${r.name}</td>
      <td style="color:var(--muted)">${r.sector}</td>
      <td class="mono">${r.price.toFixed(2)}</td>
      <td>${chk(r.stage2)}</td>
      <td>${ttD}</td>
      <td>${chk(r.vcp)}</td>
      <td>${star(r.brk)}</td>
      <td>${scoreBadge(sc)}</td>
      <td>${rpStr}</td>
    </tr>`;
  }).join('');

  document.getElementById('results').innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>代號</th><th>名稱</th><th>類股</th>
            <th>股價</th><th>Stage2</th><th>TT (7)</th>
            <th>VCP</th><th>突破</th><th>分數</th><th>停損風險</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}
